[mcu buffer_mcu]
canbus_uuid: 704fe1305bd6

[temperature_sensor buffer_Temp]
sensor_type: temperature_mcu
sensor_mcu: buffer_mcu

[buffer_stepper filament_buffer]
step_pin: buffer_mcu: PA8           
dir_pin: !buffer_mcu: PA9           
enable_pin: !buffer_mcu: PA11       
microsteps: 16                      
rotation_distance: 10               
velocity: 55                        
accel: 5000                         
push_length: 25                    
full_steps_per_rotation: 200                 

[tmc2209 buffer_stepper filament_buffer]
uart_pin: buffer_mcu: PA12
interpolate: True
run_current: 0.8
sense_resistor: 0.150          
uart_address: 3

[filament_switch_sensor filament_sensor]
pause_on_runout: True
switch_pin: ^buffer_mcu: PA10
insert_gcode:
    SET_PIN PIN=green_led VALUE=1.00
runout_gcode:
    BUFFER_STEPPER STEPPER=filament_buffer ENABLE=0
    CONTINUE_PRINT_D D={1200}

[output_pin red_led]
pin: !buffer_mcu: PC14
value: 0

[output_pin blue_led]
pin: !buffer_mcu: PC15
value: 0

[output_pin green_led]
pin: !buffer_mcu:PB1  
value: 0    

[gcode_button auto_push] # 自动送料按钮
pin: ^buffer_mcu: PB11
press_gcode:
release_gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected and printer["print_stats"].state == "printing" %}
        SET_PIN PIN=green_led VALUE=1
        BUFFER_STEPPER STEPPER=filament_buffer MOVE=25 SPEED=55 ACCEL=1000
        UPDATE_DELAYED_GCODE ID=check_tangle DURATION=2  # 2秒后检测按钮状态
    {% endif %}

[delayed_gcode check_tangle] # 耗材缠绕检测
gcode:
    {% if printer["gcode_button auto_push"].state != "PRESSED" %}
        SET_PIN PIN=green_led VALUE=0  # 关闭绿色 LED
        SET_PIN PIN=blue_led VALUE=1    # 点亮红色 LED
        PAUSE  # 暂停打印
    {% endif %}

[gcode_button manual_push] #按键手动送料
pin: buffer_mcu: PA1
press_gcode:
release_gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected and printer["print_stats"].state != "printing" %}
        SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=False
        SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=True
        BUFFER_STEPPER STEPPER=filament_buffer ENABLE=1
        FEED_LOOP
    {% else %}
        M117 not filament or printing!
    {% endif %}

[gcode_button stall_push_stop] #按键手动送料停止信号
pin: ^buffer_mcu: PB10
press_gcode:
    UPDATE_DELAYED_GCODE ID=check_clog DURATION=0
release_gcode:
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=True
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=False
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=initial_extrusion VALUE={printer.print_stats.filament_used|float}
    BUFFER_STEPPER STEPPER=filament_buffer ENABLE=0
    UPDATE_DELAYED_GCODE ID=check_clog DURATION=1

[gcode_macro variables]
variable_stop_feeding: False
variable_is_manual_feeding: False
variable_initial_extrusion: 0
gcode:
  {% if params.ACTION == 'SET' %}
    {% if params.VARIABLE == 'stop_feeding' %}
      SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE={params.VALUE}
    {% elif params.VARIABLE == 'is_manual_feeding' %}
      SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE={params.VALUE}
    {% elif params.VARIABLE == 'initial_extrusion' %}
      SET_GCODE_VARIABLE MACRO=variables VARIABLE=initial_extrusion VALUE={params.VALUE}
    {% endif %}
  {% endif %}

[gcode_macro FEED_LOOP] 
gcode:
  {% if printer["gcode_macro variables"].stop_feeding|default(False) %}
    M117 stop push filament
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=False
  {% else %}
    BUFFER_STEPPER STEPPER=filament_buffer MOVE=1 SPEED=50 ACCEL=500
    UPDATE_DELAYED_GCODE ID=feed_loop DURATION=0.1
  {% endif %}

[delayed_gcode feed_loop]
gcode:
  FEED_LOOP

[delayed_gcode check_clog] #堵头检测
gcode:
    {% set initial_extrusion = printer["gcode_macro variables"].initial_extrusion|float %}
    {% set current_extrusion = printer.print_stats.filament_used|float %}
    {% set extrusion_delta = current_extrusion - initial_extrusion %}
    {% if extrusion_delta > 2 %}  
        SET_PIN PIN=green_led VALUE=0.00
        SET_PIN PIN=red_led VALUE=1.00
        PAUSE
        UPDATE_DELAYED_GCODE ID=check_clog DURATION=0  # 停止检测
    {% else %}
        UPDATE_DELAYED_GCODE ID=check_clog DURATION=1  # 继续检测
    {% endif %}

[gcode_macro CHECK_FILAMENT_STATUS]
gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
        SET_PIN PIN=green_led VALUE=1  # 点亮绿色 LED
    {% endif %}

[delayed_gcode INITIAL_FILAMENT_CHECK]
gcode:
    CHECK_FILAMENT_STATUS  
initial_duration: 2  