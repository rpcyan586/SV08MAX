[mcu hot_mcu]
canbus_uuid: 58a72bb93aa4

[temperature_sensor chamber_mcu_Temp]
sensor_type: temperature_mcu
sensor_mcu: hot_mcu

[temperature_sensor room_temp]
sensor_type: EPCOS 100K B57560G104F
pullup_resistor: 20000
sensor_pin: hot_mcu: PA4
min_temp: 0
max_temp: 150

[heater_generic chamber_temp]
gcode_id: C
heater_pin: hot_mcu: PA0
max_power: 1.0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: watermark
max_delta: 1.0
min_temp: 0
max_temp: 65

[heater_fan chamber_fan]      
pin: hot_mcu:PA6   
max_power: 1.0      
cycle_time: 0.015         
kick_start_time: 0.5         
heater: chamber_temp             
heater_temp: 50              
tachometer_pin: hot_mcu:PA1
tachometer_ppr: 1
tachometer_poll_interval: 0.004

[verify_heater chamber_temp]      
max_error: 120                
check_gain_time:180           
hysteresis: 2                
heating_gain: 1  


