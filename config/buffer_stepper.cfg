[mcu buffer_mcu]
canbus_uuid: 704fe1305bd6

[buffer_stepper filament_buffer]
step_pin: buffer_mcu: PA8           
dir_pin: buffer_mcu: PA9           
enable_pin: !buffer_mcu: PA11       
microsteps: 16                      
rotation_distance: 10               
velocity: 55                        
accel: 5000                         
push_length: 24                    
full_steps_per_rotation: 200   
push_pin: ^buffer_mcu: PB11

[tmc2209 buffer_stepper filament_buffer]
uart_pin: buffer_mcu: PA12
interpolate: True
run_current: 0.8
hold_current: 0.4
sense_resistor: 0.150          
uart_address: 3

[filament_switch_sensor filament_sensor]
pause_on_runout: False
switch_pin: ^buffer_mcu: PA10
insert_gcode:
    SET_PIN PIN=green_led VALUE=1.00
runout_gcode:
    CONTINUE_PRINT_D D={1800}
    
[output_pin red_led]
pin: !buffer_mcu: PC14
value: 0

[output_pin blue_led]
pin: !buffer_mcu: PC15
value: 0

[output_pin green_led]
pin: !buffer_mcu:PB1  
value: 0    

[gcode_button manual_push] 
pin: buffer_mcu: PA1
press_gcode:
release_gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected and printer["print_stats"].state != "printing" and printer["gcode_button stall_push_stop"].state != "PRESSED" %}
        {% if printer["gcode_macro variables"].is_manual_feeding %}
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=True
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=False
            BUFFER_STEPPER STEPPER=filament_buffer ENABLE=0
            UPDATE_DELAYED_GCODE ID=feed_loop DURATION=0
        {% else %}
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=False
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=True
            BUFFER_STEPPER STEPPER=filament_buffer ENABLE=1
            FEED_LOOP
        {% endif %}
    {% endif %}

[gcode_button stall_push_stop] 
pin: ^buffer_mcu: PB10
press_gcode:
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=True
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=False
    BUFFER_STEPPER STEPPER=filament_buffer ENABLE=0
release_gcode:

[gcode_macro variables]
variable_stop_feeding: False
variable_is_manual_feeding: False
variable_initial_extrusion: 0
variable_stall_triggered: False
variable_plug_stall_extrusion_start: 0
variable_plug_status: False
variable_winding_status: False
gcode:
  {% if params.ACTION == 'SET' %}
    {% if params.VARIABLE == 'stop_feeding' %}
      SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE={params.VALUE}
    {% elif params.VARIABLE == 'is_manual_feeding' %}
      SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE={params.VALUE}
    {% elif params.VARIABLE == 'initial_extrusion' %}
      SET_GCODE_VARIABLE MACRO=variables VARIABLE=initial_extrusion VALUE={params.VALUE}
    {% elif params.VARIABLE == 'stall_triggered' %}
      SET_GCODE_VARIABLE MACRO=variables VARIABLE=stall_triggered VALUE={params.VALUE}
    {% elif params.VARIABLE == 'plug_stall_extrusion_start' %}
      SET_GCODE_VARIABLE MACRO=variables VARIABLE=plug_stall_extrusion_start VALUE={params.VALUE}
    {% elif params.VARIABLE == 'plug_status' %}
      SET_GCODE_VARIABLE MACRO=variables VARIABLE=plug_status VALUE={params.VALUE}
    {% elif params.VARIABLE == 'winding_status' %}
      SET_GCODE_VARIABLE MACRO=variables VARIABLE=winding_status VALUE={params.VALUE}
    {% endif %}
  {% endif %}

[gcode_macro FEED_LOOP] 
gcode:
  {% if printer["gcode_macro variables"].stop_feeding|default(False) %}
    M117 stop push filament
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=False
  {% else %}
    BUFFER_STEPPER STEPPER=filament_buffer MOVE=2 SPEED=50
    UPDATE_DELAYED_GCODE ID=feed_loop DURATION=0.06
  {% endif %}

[delayed_gcode feed_loop]
gcode:
  FEED_LOOP

[delayed_gcode plug_stall_check]
gcode:
    {% if printer["gcode_macro variables"].stall_triggered|default(False) %}
        {% set start_extrusion = printer["gcode_macro variables"].plug_stall_extrusion_start|float %}
        {% set current_extrusion = printer.print_stats.filament_used|float %}
        {% set delta = current_extrusion - start_extrusion %}
        
        {% if delta > 35 %}
            SET_PIN PIN=green_led VALUE=0.00
            SET_PIN PIN=red_led VALUE=1.00
            PAUSE
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=plug_status VALUE=True
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=stall_triggered VALUE=False
            UPDATE_DELAYED_GCODE ID=plug_stall_check DURATION=0
        {% else %}
            UPDATE_DELAYED_GCODE ID=plug_stall_check DURATION=1
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=plug_status VALUE=False
        {% endif %}
    {% else %}
        UPDATE_DELAYED_GCODE ID=plug_stall_check DURATION=0
        SET_GCODE_VARIABLE MACRO=variables VARIABLE=plug_status VALUE=False
    {% endif %}
[gcode_macro FILAMENT_USED]
gcode:
    SET_GCODE_VARIABLE MACRO=variables VARIABLE=plug_stall_extrusion_start VALUE={printer.print_stats.filament_used}
    
[gcode_macro CHECK_FILAMENT_STATUS]
gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
        SET_PIN PIN=green_led VALUE=1  
    {% endif %}

[delayed_gcode INITIAL_FILAMENT_CHECK]
gcode:
    CHECK_FILAMENT_STATUS  
initial_duration: 2  

[gcode_macro BUFFER_LONG_UNLOAD_FILAMENT]
gcode:
    UNLOAD_FILAMENT
    BUFFER_STEPPER STEPPER=filament_buffer MOVE=-2000 SPEED=50

[gcode_macro MANUAL_FEED]
gcode:
    {% if printer["filament_switch_sensor filament_sensor"].filament_detected %}
        {% if printer["gcode_macro variables"].is_manual_feeding %}
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=True
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=False
            BUFFER_STEPPER STEPPER=filament_buffer ENABLE=0
            UPDATE_DELAYED_GCODE ID=feed_loop DURATION=0
        {% else %}
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=stop_feeding VALUE=False
            SET_GCODE_VARIABLE MACRO=variables VARIABLE=is_manual_feeding VALUE=True
            BUFFER_STEPPER STEPPER=filament_buffer ENABLE=1
            FEED_LOOP
        {% endif %}
    {% endif %}